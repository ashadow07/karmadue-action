# .github/workflows/karmadue.yml
name: KarmaDue guard
on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/requirements/*.txt"
      - "**/pyproject.toml"
      - "**/poetry.lock"
      - "**/uv.lock"
      - "**/Pipfile.lock"
      - "**/.mcp.json"
      - "**/.cursor/mcp.json"
      - "**/.vscode/mcp.json"
permissions:
  contents: read
jobs:
  karmadue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ashadow07/karmadue-action@v1
        with:
          on-advisory: warn   # or fail, or ignore
